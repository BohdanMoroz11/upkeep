# Development example: replace @main with a reviewed release tag or commit before adoption.
name: Upkeep review

on:
  pull_request_target:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Major dependency PR to review
        required: true
        type: string

concurrency:
  group: upkeep-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  review:
    uses: BohdanMoroz11/upkeep/.github/workflows/review.yml@main
    with:
      app-client-id: ${{ vars.DEP_AGENT_APP_CLIENT_ID }}
      app-slug: ${{ vars.DEP_AGENT_APP_SLUG }}
      ci-workflow: ci.yml
      sanity-command: npm run typecheck
    secrets:
      app-private-key: ${{ secrets.DEP_AGENT_APP_PRIVATE_KEY }}
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
