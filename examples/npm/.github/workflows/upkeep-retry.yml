# Development example: replace @main with a reviewed release tag or commit before adoption.
name: Upkeep retry

on:
  workflow_run:
    workflows: [CI] # The name in your CI workflow, not its filename.
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_branch:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string

concurrency:
  group: upkeep-retry-${{ github.event.workflow_run.head_branch || inputs.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  retry:
    uses: BohdanMoroz11/upkeep/.github/workflows/retry.yml@main
    with:
      app-client-id: ${{ vars.DEP_AGENT_APP_CLIENT_ID }}
      app-slug: ${{ vars.DEP_AGENT_APP_SLUG }}
      ci-workflow: ci.yml
      sanity-command: npm run typecheck
    secrets:
      app-private-key: ${{ secrets.DEP_AGENT_APP_PRIVATE_KEY }}
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
